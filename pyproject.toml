[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hkestate"
version = "0.1.0"
description = "Personal research tool for Hong Kong private residential flats"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "shap>=0.45",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "streamlit>=1.36",
    "pydeck>=0.9",
    "rapidfuzz>=3.9",
    "opencc-python-reimplemented>=0.1.7",
    "xlrd>=2.0",  # RVD publishes legacy .xls files
    "pyyaml>=6.0",  # keyword list for listing flags
    "pdfplumber>=0.11",  # SRPE registers of transactions are PDFs
]

[project.scripts]
hkestate = "hkestate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hkestate = ["keywords.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
